<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Background seal -->
  <rect x="0.5" y="0.5" width="35" height="35" rx="5.5" fill="#F8F3E8" stroke="#E4D8BE" stroke-width="1"/>
  <!-- Greek Pi letterform -->
  <text x="18" y="25.5"
    font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="600"
    fill="#1E3D6E"
    text-anchor="middle"
    dominant-baseline="auto">Π</text>
  <!-- Gold manuscript baseline rule -->
  <rect x="8" y="29" width="20" height="1.5" rx="0.75" fill="#B8842A"/>
</svg>

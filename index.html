<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        const originalFetch = window.fetch;
        const descriptor = {
          get: function() { return originalFetch; },
          set: function(v) { console.debug('Intercepted fetch polyfill assignment'); },
          configurable: true,
          enumerable: true
        };
        try {
          Object.defineProperty(window, 'fetch', descriptor);
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', descriptor);
          } catch (e2) {}
        }
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          try { Object.defineProperty(globalThis, 'fetch', descriptor); } catch (e) {}
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

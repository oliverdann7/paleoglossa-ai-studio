    <script>
      (function() {
        if (typeof window === 'undefined') return;
        const originalFetch = window.fetch;
        const descriptor = {
          get: function() { return originalFetch; },
          set: function(v) { console.debug('Intercepted fetch polyfill assignment'); },
          configurable: true,
          enumerable: true
        };
        try {
          Object.defineProperty(window, 'fetch', descriptor);
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', descriptor);
          } catch (e2) {}
        }
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          try { Object.defineProperty(globalThis, 'fetch', descriptor); } catch (e) {}
        }
      })();
    </script>

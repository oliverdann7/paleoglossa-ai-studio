<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Paleoglossa mark">
  <title>Paleoglossa — mark</title>
  <desc>A Greek capital pi on parchment, underscored by a gold manuscript rule.</desc>
  <defs>
    <radialGradient id="mark-vignette" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#C8AA80" stop-opacity="0.26"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#F8F3E8"/>
  <rect width="512" height="512" rx="104" fill="url(#mark-vignette)"/>

  <!-- Inset scribal rule -->
  <rect x="32" y="32" width="448" height="448" rx="78" fill="none" stroke="#E0D0AE" stroke-width="3"/>

  <!-- Greek capital pi, drawn as paths so no font is required -->
  <g fill="#1E3D6E">
    <!-- head bar, overhanging both legs -->
    <rect x="94" y="130" width="324" height="48" rx="11"/>
    <!-- left leg with bracketed serif foot -->
    <path d="M148 178h44v126c0 24 10 34 32 38l14 3v23H102v-23l14-3c22-4 32-14 32-38z"/>
    <!-- right leg with bracketed serif foot -->
    <path d="M320 178h44v126c0 24 10 34 32 38l14 3v23H274v-23l14-3c22-4 32-14 32-38z"/>
  </g>

  <!-- Gold manuscript baseline rule -->
  <rect x="102" y="392" width="308" height="16" rx="8" fill="#B8842A"/>
</svg>

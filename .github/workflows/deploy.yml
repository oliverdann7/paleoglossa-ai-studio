name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # runs independently; CI workflow handles checks on PRs
    timeout-minutes: 15  # fail fast if the Vercel CLI ever prompts interactively again

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./

      # The API once shipped dead for weeks (every /api/* route returned
      # FUNCTION_INVOCATION_FAILED) with nothing failing in CI. Probe the live
      # function after every production deploy so that can never be silent again.
      - name: Smoke-check production API
        run: |
          for i in $(seq 1 10); do
            # -L: the apex domain 307-redirects to www — follow it or a healthy API reads as a 307 failure
            code=$(curl -sL -o /tmp/health.json -w '%{http_code}' --max-time 15 https://paleoglossa.com/api/health || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "API healthy:"; cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: /api/health returned $code — retrying in 15s"
            sleep 15
          done
          echo "::error::Production API is unhealthy after deploy — /api/health kept failing"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

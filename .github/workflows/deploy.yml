name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # runs independently; CI workflow handles checks on PRs
    timeout-minutes: 15  # fail fast if the Vercel CLI ever prompts interactively again

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Vercel's API enforces a minimum CLI version (47.2.2 as of 2026-07), which
      # the unmaintained amondnet/vercel-action bundled too old a CLI to meet —
      # so invoke the CLI directly at @latest. ORG/PROJECT env vars replace
      # `vercel link`; --yes keeps it non-interactive.
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

      # The API once shipped dead for weeks (every /api/* route returned
      # FUNCTION_INVOCATION_FAILED) with nothing failing in CI. Probe the live
      # function after every production deploy so that can never be silent again.
      - name: Smoke-check production API
        run: |
          for i in $(seq 1 10); do
            # -L: the apex domain 307-redirects to www — follow it or a healthy API reads as a 307 failure
            code=$(curl -sL -o /tmp/health.json -w '%{http_code}' --max-time 15 https://paleoglossa.com/api/health || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "API healthy:"; cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: /api/health returned $code — retrying in 15s"
            sleep 15
          done
          echo "::error::Production API is unhealthy after deploy — /api/health kept failing"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

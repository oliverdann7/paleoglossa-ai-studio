name: Firestore Rules & Persistence

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules/**'
      - 'src/lib/services/**'

jobs:
  rules-tests:
    name: Firestore emulator rules tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install Java (required by Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: npm run test:firestore-rules

  persistence-tests:
    name: Service persistence tests (mocked)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run persistence tests
        run: npm run test:persistence
